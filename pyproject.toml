[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saurus-fsspec"
version = "0.1.0"
description = "fsspec backend for streaming the SAURUS Staphylococcus aureus database into pandas"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Brown Beckley", email = "brownbeckley94@gmail.com"},
]
keywords = [
    "bioinformatics", "genomics", "staphylococcus-aureus", "mrsa",
    "fsspec", "pandas", "surveillance", "amr", "genomic-epidemiology",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "fsspec>=2023.1.0",
    "requests>=2.28.0",
    "pandas>=1.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage   = "https://saurus-db.org/"
Repository = "https://github.com/bbeckley-hub/saurus-fsspec"

[project.entry-points."fsspec.specs"]
saurus = "saurus_fsspec:SaurusFileSystem"

[tool.setuptools]
packages = ["saurus_fsspec"]

[tool.pytest.ini_options]
markers = [
    "network: tests that require a live connection to saurus-db.org",
    "slow: slow tests that read full tables (>1 MB, >1 s)",
]
testpaths = ["tests"]
